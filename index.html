<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyber Bot Arena: Live Multi-Zone</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #04050a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .hud-element {
            position: absolute;
            color: #00ffff;
            font-weight: bold;
            font-family: monospace;
            font-size: 16px;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }
        #score-display {
            top: 20px;
            left: 20px;
        }
        #chat-log {
            bottom: 140px;
            left: 20px;
            width: 240px;
            height: 100px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            font-size: 12px;
            color: #00ffaa;
            text-shadow: 0 0 4px rgba(0,255,170,0.4);
            opacity: 0.8;
        }
        .chat-msg {
            margin-top: 3px;
            animation: fadeIn 0.2s ease-out;
        }
        #health-container {
            top: 20px;
            right: 20px;
            width: 160px;
            height: 20px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 10px;
            overflow: hidden;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #0088ff);
        }
        #audio-hint {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(0, 255, 255, 0.4);
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 5, 10, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        #game-over-screen h1 {
            color: #ff0055;
            font-size: 38px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }
        #game-over-screen p {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 25px;
        }
        .btn {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            color: #050710;
            background: #00ffff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="score-display" class="hud-element">MATCH POINTS: 0</div>
        <div id="chat-log" class="hud-element"></div>
        <div id="health-container" class="hud-element">
            <div id="health-bar"></div>
        </div>
        <div id="audio-hint" class="hud-element">TAP TO SYNC AUDIO DRIVERS</div>
    </div>

    <div id="game-over-screen">
        <h1>CONNECTION LOST</h1>
        <p id="final-score">FINAL SCORE: 0</p>
        <button class="btn" id="restart-btn">RESPAWN IN MATCH</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const chatLog = document.getElementById('chat-log');
        const healthBar = document.getElementById('health-bar');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreText = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const audioHint = document.getElementById('audio-hint');

        let audioCtx = null;
        let gameState = 'playing'; 
        let score = 0;
        let scaleMultiplier = 1;
        
        const mapWidth = 2000;
        const mapHeight = 2000;
        let camera = { x: 0, y: 0 };
        
        let player;
        let structures = [];
        let bullets = [];
        let enemies = [];
        let allies = [];
        let medkits = [];
        let particles = [];
        
        let keys = {};
        let mouseX = 0, mouseY = 0, isMouseDown = false;
        
        let leftJoystick = { x: 0, y: 0, active: false, startX: 0, startY: 0, currentX: 0, currentY: 0, pointerId: null };
        let rightJoystick = { x: 0, y: 0, active: false, startX: 0, startY: 0, currentX: 0, currentY: 0, pointerId: null };
        let joystickRadius = 60;
        
        let lastSpawnTime = 0;
        let lastMedkitTime = 0;
        const botNames = ['X_Rider', 'HyperVolt', 'Glitch_Fixer', 'Cyber_Ghost', 'NullPointer', 'ByteMe'];
        const chatPhrases = ['Need backup at HQ!', 'Grab the heals!', 'Tanks incoming', 'Nice shot!', 'Behind you!', 'Clean sweep'];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioHint.style.display = 'none';
            }
        }

        function playLaserSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(700, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playExplodeSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function playHealSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        }

        function addChatMessage(sender, msg) {
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<span style="color:#00ffff;">[${sender}]:</span> ${msg}`;
            chatLog.appendChild(div);
            if(chatLog.childNodes.length > 4) chatLog.removeChild(chatLog.firstChild);
        }

        function buildMap() {
            structures = [
                { x: 350, y: 350, w: 250, h: 250, label: "SEC ALPHA" },
                { x: 1400, y: 350, w: 250, h: 250, label: "SEC BETA" },
                { x: 350, y: 1400, w: 250, h: 250, label: "NEX REACTOR" },
                { x: 1400, y: 1400, w: 250, h: 250, label: "CARGO YARD" },
                { x: 900, y: 900, w: 200, h: 200, label: "CENTER CORE" }
            ];
        }

        function checkWallCollision(x, y, radius) {
            for (let b of structures) {
                let closestX = Math.max(b.x, Math.min(x, b.x + b.w));
                let closestY = Math.max(b.y, Math.min(y, b.y + b.h));
                let distSq = (x - closestX)**2 + (y - closestY)**2;
                if (distSq < radius**2) return true;
            }
            return false;
        }

        function drawHealthBar(x, y, radius, current, max) {
            let barW = radius * 2.2;
            let barH = 4 * scaleMultiplier;
            let bx = x - barW / 2;
            let by = y - radius - 10;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(bx, by, barW, barH);
Use code with caution.
ctx.fillStyle = current / max > 0.35 ? '#00ffaa' : '#ff0055';
ctx.fillRect(bx, by, barW * (current / max), barH);
}
function initCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
scaleMultiplier = Math.min(canvas.width, canvas.height) / 800;
if(scaleMultiplier < 0.6) scaleMultiplier = 0.6;
joystickRadius = 55 * scaleMultiplier;
leftJoystick.x = 80 * scaleMultiplier + joystickRadius;
leftJoystick.y = canvas.height - (80 * scaleMultiplier + joystickRadius);
rightJoystick.x = canvas.width - (80 * scaleMultiplier + joystickRadius);
rightJoystick.y = canvas.height - (80 * scaleMultiplier + joystickRadius);
}
class Player {
constructor() {
this.x = mapWidth / 2; this.y = mapHeight / 2 + 150;
this.radius = 16 * scaleMultiplier; this.speed = 4.2 * scaleMultiplier;
this.angle = 0; this.maxHealth = 100; this.health = 100;
this.fireCooldown = 0; this.fireRate = 12;
}
update() {
let moveX = 0, moveY = 0;
if (keys['w'] || keys['ArrowUp']) moveY -= 1;
if (keys['s'] || keys['ArrowDown']) moveY += 1;
if (keys['a'] || keys['Left']) moveX -= 1;
if (keys['d'] || keys['Right']) moveX += 1;
if (leftJoystick.active) {
let dx = leftJoystick.currentX - leftJoystick.startX, dy = leftJoystick.currentY - leftJoystick.startY;
let d = Math.hypot(dx, dy);
if (d > 0) {
moveX = (dx / d) * Math.min(d, joystickRadius) / joystickRadius;
moveY = (dy / d) * Math.min(d, joystickRadius) / joystickRadius;
}
}
if (moveX !== 0) {
let nX = this.x + moveX * this.speed;
if (nX >= this.radius && nX <= mapWidth - this.radius && !checkWallCollision(nX, this.y, this.radius)) this.x = nX;
}
if (moveY !== 0) {
let nY = this.y + moveY * this.speed;
if (nY >= this.radius && nY <= mapHeight - this.radius && !checkWallCollision(this.x, nY, this.radius)) this.y = nY;
}
if (rightJoystick.active) {
let rdx = rightJoystick.currentX - rightJoystick.startX, rdy = rightJoystick.currentY - rightJoystick.startY;
if (Math.hypot(rdx, rdy) > 10) {
this.angle = Math.atan2(rdy, rdx);
if (this.fireCooldown <= 0) { this.fire(true); this.fireCooldown = this.fireRate; }
}
} else if (isMouseDown) {
this.angle = Math.atan2((mouseY + camera.y) - this.y, (mouseX + camera.x) - this.x);
if (this.fireCooldown <= 0) { this.fire(true); this.fireCooldown = this.fireRate; }
}
if (this.fireCooldown > 0) this.fireCooldown--;
}
fire(isPlayerControlled) {
let bX = this.x + Math.cos(this.angle) * this.radius, bY = this.y + Math.sin(this.angle) * this.radius;
bullets.push(new Bullet(bX, bY, this.angle, isPlayerControlled));
if (isPlayerControlled) playLaserSound();
}
draw() {
ctx.save(); ctx.translate(this.x - camera.x, this.y - camera.y); ctx.rotate(this.angle);
ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff'; ctx.stroke();
ctx.beginPath(); ctx.moveTo(0, -this.radius * 0.4); ctx.lineTo(this.radius * 1.3, 0); ctx.lineTo(0, this.radius * 0.4); ctx.closePath();
ctx.fillStyle = '#00ffff'; ctx.fill(); ctx.restore();
drawHealthBar(this.x - camera.x, this.y - camera.y, this.radius, this.health, this.maxHealth);
}
damage(amt) {
this.health -= amt;
if (this.health <= 0) { this.health = 0; endGame(); }
healthBar.style.width = ${(this.health / this.maxHealth) * 100}%;
}
}
class SimulatedAlly {
constructor(x, y, name) {
this.x = x; this.y = y; this.name = name;
this.radius = 15 * scaleMultiplier; this.speed = 2.5 * scaleMultiplier;
this.health = 100; this.maxHealth = 100; this.angle = 0; this.cooldown = 0;
}
update() {
let target = null, minDist = 400;
for (let e of enemies) {
let d = Math.hypot(e.x - this.x, e.y - this.y);
if (d < minDist) { minDist = d; target = e; }
}
if (target) {
this.angle = Math.atan2(target.y - this.y, target.x - this.x);
if (minDist > 120) {
let nX = this.x + Math.cos(this.angle) * this.speed, nY = this.y + Math.sin(this.angle) * this.speed;
if (!checkWallCollision(nX, this.y, this.radius)) this.x = nX;
if (!checkWallCollision(this.x, nY, this.radius)) this.y = nY;
}
if (this.cooldown <= 0) {
bullets.push(new Bullet(this.x, this.y, this.angle, false));
this.cooldown = 18 + Math.random()10;
}
} else {
// Wander toward map center or items if idle
this.angle += (Math.random() - 0.5) * 0.2;
let nX = this.x + Math.cos(this.angle) * (this.speed0.5), nY = this.y + Math.sin(this.angle) * (this.speed*0.5);
if (nX > 50 && nX < mapWidth - 50 && !checkWallCollision(nX, this.y, this.radius)) this.x = nX;
if (nY > 50 && nY < mapHeight - 50 && !checkWallCollision(this.x, nY, this.radius)) this.y = nY;
}
if(this.cooldown > 0) this.cooldown--;
// Random chat callout logic
if (Math.random() < 0.0008) addChatMessage(this.name, chatPhrases[Math.floor(Math.random()*chatPhrases.length)]);
}
draw() {
ctx.save(); ctx.translate(this.x - camera.x, this.y - camera.y);
ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
ctx.strokeStyle = '#0088ff'; ctx.lineWidth = 2.5; ctx.stroke();
ctx.fillStyle = '#0055aa50'; ctx.fill();
ctx.fillStyle = '#00ffff'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
ctx.fillText(this.name, 0, -this.radius - 16); ctx.restore();
drawHealthBar(this.x - camera.x, this.y - camera.y, this.radius, this.health, this.maxHealth);
}
}
class Enemy {
constructor(x, y, type) {
this.x = x; this.y = y; this.type = type; this.markedForRemoval = false;
if (type === 'tank') {
this.radius = 24 * scaleMultiplier; this.speed = 1.2 * scaleMultiplier; this.health = this.maxHealth = 5; this.color = '#bd00ff'; this.pts = 50;
} else {
this.radius = 16 * scaleMultiplier; this.speed = 2.0 * scaleMultiplier; this.health = this.maxHealth = 2; this.color = '#ff0055'; this.pts = 15;
}
}
update() {
// Aggro on closest target (Player or Ally clone bots)
let targets = [player, ...allies];
let closest = player, minDist = 9999;
for(let t of targets) {
let d = Math.hypot(t.x - this.x, t.y - this.y);
if(d < minDist) { minDist = d; closest = t; }
}
let angle = Math.atan2(closest.y - this.y, closest.x - this.x);
let nX = this.x + Math.cos(angle) * this.speed, nY = this.y + Math.sin(angle) * this.speed;
if (!checkWallCollision(nX, this.y, this.radius)) this.x = nX;
if (!checkWallCollision(this.x, nY, this.radius)) this.y = nY;
if (minDist < this.radius + closest.radius) {
closest.damage(15); this.markedForRemoval = true;
playExplodeSound(); createExplosion(this.x, this.y, this.color, 8);
}
}
draw() {
ctx.save(); ctx.translate(this.x - camera.x, this.y - camera.y);
ctx.beginPath(); let sides = this.type === 'tank' ? 6 : 4;
for(let i=0; i<sides; i++) {
let a = (i * Math.PI * 2 / sides);
let sx = Math.cos(a) * this.radius, sy = Math.sin(a) * this.radius;
if(i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
}
ctx.closePath(); ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.stroke();
ctx.fillStyle = this.color + "20"; ctx.fill(); ctx.restore();
drawHealthBar(this.x - camera.x, this.y - camera.y, this.radius, this.health, this.maxHealth);
}
hit(isPlayerBullet) {
this.health--;
if (this.health <= 0) {
this.markedForRemoval = true;
if(isPlayerBullet) { score += this.pts; scoreDisplay.innerText = MATCH POINTS: ${score}; }
playExplodeSound(); createExplosion(this.x, this.y, this.color, 12);
}
}
}
class Bullet {
constructor(x, y, angle, isPlayer) {
this.x = x; this.y = y; this.isPlayer = isPlayer;
this.vx = Math.cos(angle) * (11 * scaleMultiplier); this.vy = Math.sin(angle) * (11 * scaleMultiplier);
this.radius = 4 * scaleMultiplier; this.markedForRemoval = false;
}
update() {
this.x += this.vx; this.y += this.vy;
if (this.x < 0 || this.x > mapWidth || this.y < 0 || this.y > mapHeight || checkWallCollision(this.x, this.y, this.radius)) {
this.markedForRemoval = true;
}
}
draw() {
ctx.save(); ctx.beginPath(); ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
ctx.fillStyle = this.isPlayer ? '#ffffff' : '#00aaff'; ctx.shadowBlur = 6; ctx.shadowColor = '#00ffff'; ctx.fill(); ctx.restore();
}
}
class Medkit {
constructor(x, y) { this.x = x; this.y = y; this.radius = 12 * scaleMultiplier; }
draw() {
let tx = this.x - camera.x, ty = this.y - camera.y;
ctx.save(); ctx.shadowBlur = 8; ctx.shadowColor = '#00ffaa';
ctx.fillStyle = '#00ffaa'; ctx.fillRect(tx - this.radius, ty - this.radius/3, this.radius2, this.radius/1.5);
ctx.fillRect(tx - this.radius/3, ty - this.radius, this.radius/1.5, this.radius2);
ctx.restore();
}
}
class Particle {
constructor(x, y, color, vx, vy, life) {
this.x = x; this.y = y; this.color = color; this.vx = vx; this.vy = vy; this.maxLife = this.life = life;
}
update() { this.x += this.vx; this.y += this.vy; this.life--; }
draw() {
ctx.save(); ctx.beginPath(); ctx.arc(this.x - camera.x, this.y - camera.y, 2, 0, Math.PI * 2);
ctx.fillStyle = this.color; ctx.globalAlpha = this.life / this.maxLife; ctx.fill(); ctx.restore();
}
}
function createExplosion(x, y, color, count) {
for (let i = 0; i < count; i++) {
let a = Math.random() * Math.PI * 2, s = (1 + Math.random() * 3) * scaleMultiplier;
particles.push(new Particle(x, y, color, Math.cos(a)*s, Math.sin(a)*s, 20));
}
}
function updateFrame(timestamp) {
if (gameState !== 'playing') return;
ctx.fillStyle = '#05060b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
camera.x = Math.max(0, Math.min(mapWidth - canvas.width, player.x - canvas.width / 2));
camera.y = Math.max(0, Math.min(mapHeight - canvas.height, player.y - canvas.height / 2));
// Map grid rendering
ctx.strokeStyle = '#101525'; ctx.lineWidth = 2;
for(let x=0; x<mapWidth; x+=80) { ctx.beginPath(); ctx.moveTo(x-camera.x, 0); ctx.lineTo(x-camera.x, mapHeight); ctx.stroke(); }
for(let y=0; y<mapHeight; y+=80) { ctx.beginPath(); ctx.moveTo(0, y-camera.y); ctx.lineTo(mapWidth, y-camera.y); ctx.stroke(); }
structures.forEach(b => {
ctx.fillStyle = '#0f1222'; ctx.strokeStyle = '#00ffff';
ctx.fillRect(b.x - camera.x, b.y - camera.y, b.w, b.h);
ctx.strokeRect(b.x - camera.x, b.y - camera.y, b.w, b.h);
ctx.fillStyle = 'rgba(0,255,255,0.2)'; ctx.font = '11px monospace'; ctx.textAlign='center';
ctx.fillText(b.label, b.x + b.w/2 - camera.x, b.y + b.h/2 - camera.y);
});
// Spawning rules engine
if (timestamp - lastSpawnTime > 1500) {
lastSpawnTime = timestamp;
if(enemies.length < 12) {
let rx = Math.random()*mapWidth, ry = Math.random()*mapHeight;
if(!checkWallCollision(rx, ry, 24)) enemies.push(new Enemy(rx, ry, Math.random() < 0.25 ? 'tank':'standard'));
}
}
if (timestamp - lastMedkitTime > 5000) {
lastMedkitTime = timestamp;
if(medkits.length < 4) {
let rx = Math.random()*mapWidth, ry = Math.random()*mapHeight;
if(!checkWallCollision(rx, ry, 15)) medkits.push(new Medkit(rx, ry));
}
}
player.update(); player.draw();
// Medkit collision checks
for(let i=medkits.length-1; i>=0; i--) {
let m = medkits[i]; m.draw();
if(Math.hypot(player.x - m.x, player.y - m.y) < player.radius + m.radius) {
player.health = Math.min(player.maxHealth, player.health + 35);
healthBar.style.width = ${player.health}%;
playHealSound(); medkits.splice(i, 1);
}
}
allies.forEach((a, idx) => {
a.update(); a.draw();
if(a.health <= 0) {
createExplosion(a.x, a.y, '#0088ff', 15);
addChatMessage('SERVER', ${a.name} respawning soon...);
allies[idx] = new SimulatedAlly(mapWidth/2 + (Math.random()-0.5)*200, mapHeight/2, botNames[Math.floor(Math.random()*botNames.length)]);
}
});
for (let i = bullets.length - 1; i >= 0; i--) {
let b = bullets[i]; b.update(); if (b.markedForRemoval) { bullets.splice(i, 1); continue; }
b.draw();
for (let j = enemies.length - 1; j >= 0; j--) {
let e = enemies[j];
if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
e.hit(b.isPlayer); b.markedForRemoval = true; break;
}
}
}
for (let i = enemies.length - 1; i >= 0; i--) {
let e = enemies[i]; e.update();
if (e.markedForRemoval) { enemies.splice(i, 1); continue; }
e.draw();
}
for (let i = particles.length - 1; i >= 0; i--) {
let p = particles[i]; p.update(); if (p.life <= 0) { particles.splice(i, 1); continue; } p.draw();
}
drawJoystick(leftJoystick); drawJoystick(rightJoystick);
requestAnimationFrame(updateFrame);
}
function drawJoystick(js) {
if (!js.active) return;
ctx.save(); ctx.beginPath(); ctx.arc(js.startX, js.startY, joystickRadius, 0, Math.PI * 2);
ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)'; ctx.lineWidth = 2; ctx.stroke();
let dx = js.currentX - js.startX, dy = js.currentY - js.startY, d = Math.hypot(dx, dy);
let kX = js.startX + (d > joystickRadius ? (dx / d) * joystickRadius : dx);
let kY = js.startY + (d > joystickRadius ? (dy / d) * joystickRadius : dy);
ctx.beginPath(); ctx.arc(kX, kY, joystickRadius * 0.35, 0, Math.PI * 2);
ctx.fillStyle = 'rgba(0, 255, 255, 0.3)'; ctx.strokeStyle = '#00ffff'; ctx.stroke(); ctx.fill(); ctx.restore();
}
function startGame() {
score = 0; bullets = []; enemies = []; allies = []; medkits = []; particles = [];
gameState = 'playing'; scoreDisplay.innerText = MATCH POINTS: ${score};
healthBar.style.width = '100%'; gameOverScreen.classList.remove('active');
chatLog.innerHTML = '';
initCanvas(); buildMap();
player = new Player();
allies.push(new SimulatedAlly(mapWidth/2 - 100, mapHeight/2, 'Neon_Viper'));
allies.push(new SimulatedAlly(mapWidth/2 + 100, mapHeight/2, 'Matrix_Runner'));
addChatMessage('SYSTEM', 'Joined Arena server #241');
lastSpawnTime = lastMedkitTime = performance.now();
requestAnimationFrame(updateFrame);
}
function endGame() { gameState = 'gameover'; finalScoreText.innerText = FINAL SCORE: ${score}; gameOverScreen.classList.add('active'); }
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);
window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
window.addEventListener('mousedown', () => { initAudio(); if(gameState==='playing') isMouseDown = true; });
window.addEventListener('mouseup', () => isMouseDown = false);
window.addEventListener('resize', initCanvas);
window.addEventListener('touchstart', initAudio, { passive: true });
canvas.addEventListener('pointerdown', e => {
initAudio();
if (e.clientX < canvas.width / 2) {
if (!leftJoystick.active) { leftJoystick.active = true; leftJoystick.pointerId = e.pointerId; leftJoystick.startX = leftJoystick.currentX = e.clientX; leftJoystick.startY = leftJoystick.currentY = e.clientY; }
} else {
if (!rightJoystick.active) { rightJoystick.active = true; rightJoystick.pointerId = e.pointerId; rightJoystick.startX = rightJoystick.currentX = e.clientX; rightJoystick.startY = rightJoystick.currentY = e.clientY; }
}
});
canvas.addEventListener('pointermove', e => {
if (leftJoystick.active && leftJoystick.pointerId === e.pointerId) { leftJoystick.currentX = e.clientX; leftJoystick.currentY = e.clientY; }
if (rightJoystick.active && rightJoystick.pointerId === e.pointerId) { rightJoystick.currentX = e.clientX; rightJoystick.currentY = e.clientY; }
});
const release = e => {
if (leftJoystick.active && leftJoystick.pointerId === e.pointerId) leftJoystick.active = false;
if (rightJoystick.active && rightJoystick.pointerId === e.pointerId) rightJoystick.active = false;
};
canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);
restartBtn.addEventListener('click', startGame);
startGame();
