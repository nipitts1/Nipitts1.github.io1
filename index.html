<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angy Physics Blob on Fire</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111216;
            font-family: system-ui, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="instructions">Stretch or smash him completely to set his head on fire!</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const mouse = { x: 0, y: 0, px: 0, py: 0, down: false, draggedNode: null };

        const GRAVITY = 0.3;
        const BOUNCE_DAMPING = 0.6;
        const FRICTION = 0.99;
        const ANGER_DECAY = 0.012; // Lowered slightly so fire stays active longer

        // Particle System for the Fire Effect
        class Particle {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.alpha = 1;
                this.size = Math.random() * 8 + 6;
                this.maxLife = Math.random() * 20 + 15;
                this.life = this.maxLife;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy -= 0.15; // Floating upwards factor
                this.life--;
                this.alpha = this.life / this.maxLife;
                this.size = Math.max(0.1, this.size - 0.2);
            }
            draw() {
                ctx.save();
                ctx.globalCompositeOperation = 'screen'; // Makes flames blend glowingly
                // Map color from white/yellow at birth to red/orange at death
                let progress = this.life / this.maxLife;
                let r = 255;
                let g = Math.floor(progress * 200 + 55);
                let b = Math.floor(progress * 50);
                
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Point {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.px = x;
                this.py = y;
            }
            update() {
                let vx = (this.x - this.px) * FRICTION;
                let vy = (this.y - this.py) * FRICTION + GRAVITY;
                this.px = this.x;
                this.py = this.y;
                this.x += vx;
                this.y += vy;
            }
            constrain() {
                let vx = this.x - this.px;
                let vy = this.y - this.py;

                if (this.x > canvas.width) {
                    this.x = canvas.width;
                    this.px = this.x + vx * BOUNCE_DAMPING;
                    blob.registerImpact(Math.abs(vx));
                } else if (this.x < 0) {
                    this.x = 0;
                    this.px = this.x + vx * BOUNCE_DAMPING;
                    blob.registerImpact(Math.abs(vx));
                }
                if (this.y > canvas.height) {
                    this.y = canvas.height;
                    this.py = this.y + vy * BOUNCE_DAMPING;
                    blob.registerImpact(Math.abs(vy));
                } else if (this.y < 0) {
                    this.y = 0;
                    this.py = this.y + vy * BOUNCE_DAMPING;
                    blob.registerImpact(Math.abs(vy));
                }
            }
        }

        class Link {
            constructor(p1, p2, length, stiffness = 0.1) {
                this.p1 = p1;
                this.p2 = p2;
                this.length = length;
                this.stiffness = stiffness;
            }
            resolve() {
                let dx = this.p2.x - this.p1.x;
                let dy = this.p2.y - this.p1.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                let diff = this.length - dist;
                let percent = (diff / dist) * this.stiffness;
                let offsetX = dx * percent;
                let offsetY = dy * percent;

                let strain = Math.abs(dist - this.length) / this.length;
                if (strain > 0.35) {
                    blob.anger += (strain - 0.35) * 0.06;
                }

                this.p1.x -= offsetX;
                this.p1.y -= offsetY;
                this.p2.x += offsetX;
                this.p2.y += offsetY;
            }
        }

        class Blob {
            constructor(cx, cy, radius, numPoints) {
                this.points = [];
                this.links = [];
                this.particles = [];
                this.center = new Point(cx, cy);
                this.radius = radius;
                this.anger = 0; 
                this.danceTime = 0;

                for (let i = 0; i < numPoints; i++) {
                    let angle = (i / numPoints) * Math.PI * 2;
                    let x = cx + Math.cos(angle) * radius;
                    let y = cy + Math.sin(angle) * radius;
                    this.points.push(new Point(x, y));
                }

                for (let i = 0; i < numPoints; i++) {
                    let next = (i + 1) % numPoints;
                    this.links.push(new Link(this.points[i], this.points[next], radius * (Math.PI * 2 / numPoints), 0.4));
                }

                for (let i = 0; i < numPoints; i++) {
                    this.links.push(new Link(this.points[i], this.center, radius, 0.2));
                    let cross = (i + Math.floor(numPoints/2)) % numPoints;
                    this.links.push(new Link(this.points[i], this.points[cross], radius * 2, 0.05));
                }
            }

            registerImpact(velocity) {
                if (velocity > 4) {
                    this.anger += (velocity - 4) * 0.1;
                }
            }

            update() {
                this.anger = Math.max(0, Math.min(1, this.anger - ANGER_DECAY));
                this.danceTime += 0.05 + (this.anger * 0.12);

                if (!mouse.down) {
                    this.center.y += Math.cos(this.danceTime * 1.5) * 2;
                    this.points.forEach((p, idx) => {
                        let factor = idx % 2 === 0 ? 1 : -1;
                        p.x += Math.sin(this.danceTime + idx) * (0.8 - this.anger * 0.5) * factor;
                    });
                }

                this.center.update();
                this.points.forEach(p => p.update());

                if (mouse.down && mouse.draggedNode) {
                    mouse.draggedNode.x = mouse.x;
                    mouse.draggedNode.y = mouse.y;
                }

                for (let k = 0; k < 6; k++) {
                    this.links.forEach(l => l.resolve());
                    this.center.constrain();
                    this.points.forEach(p => p.constrain());
                }

                // --- Fire Spawning Logic ---
                // Identify the top nodes of the blob's head
                let headNodes = [...this.points].sort((a, b) => a.y - b.y).slice(0, 3);
                
                if (this.anger > 0.75) {
                    // Spawn fire scale relative to how angry he is past the 75% threshold
                    let intensity = Math.floor((this.anger - 0.75) * 20); 
                    for (let i = 0; i < intensity; i++) {
                        let targetNode = headNodes[Math.floor(Math.random() * headNodes.length)];
                        let vx = (Math.random() - 0.5) * 3 + (this.center.x - this.center.px) * 0.3;
                        let vy = -Math.random() * 2;
                        this.particles.push(new Particle(targetNode.x + (Math.random() - 0.5) * 15, targetNode.y, vx, vy));
                    }
                }

                // Update existing flame particles
                this.particles.forEach(p => p.update());
                this.particles = this.particles.filter(p => p.life > 0);
            }

            draw() {
                // If he is at maximum fury, give him an intense back-glow effect
                if (this.anger > 0.75) {
                    ctx.save();
                    ctx.shadowBlur = (this.anger - 0.75) * 120;
                    ctx.shadowColor = "rgba(255, 68, 0, 0.8)";
                }

                // Character Color Progression
                let r = Math.floor(65 + this.anger * 190);
                let g = Math.floor(185 - this.anger * 165);
                let b = Math.floor(150 - this.anger * 110);
                
                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);
                for (let i = 0; i < this.points.length; i++) {
                    let curr = this.points[i];
                    let next = this.points[(i + 1) % this.points.length];
                    let xc = (curr.x + next.x) / 2;
                    let yc = (curr.y + next.y) / 2;
                    ctx.quadraticCurveTo(curr.x, curr.y, xc, yc);
                }
                ctx.closePath();
                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
Use code with caution.
ctx.fill();
if (this.anger > 0.75) ctx.restore();
// Draw Flame Particle Overlay
this.particles.forEach(p => p.draw());
// Gaze Calculations
let avgX = 0, avgY = 0;
this.points.forEach(p => { avgX += p.x; avgY += p.y; });
avgX /= this.points.length;
avgY /= this.points.length;
let faceX = this.center.x + (this.center.x - avgX) * 0.4;
let faceY = this.center.y + (this.center.y - avgY) * 0.4 - 5;
// Eyes Rendering
ctx.fillStyle = "#ffffff";
let eyeSpacing = 22;
let eyeSize = Math.max(2, 9 - (this.anger * 5));
ctx.beginPath();
ctx.arc(faceX - eyeSpacing, faceY, eyeSize, 0, Math.PI * 2);
ctx.arc(faceX + eyeSpacing, faceY, eyeSize, 0, Math.PI * 2);
ctx.fill();
let lookX = (this.center.x - this.center.px) * 0.4;
let lookY = (this.center.y - this.center.py) * 0.4;
ctx.fillStyle = "#000000";
ctx.beginPath();
ctx.arc(faceX - eyeSpacing + lookX, faceY + lookY, eyeSize * 0.5, 0, Math.PI * 2);
ctx.arc(faceX + eyeSpacing + lookX, faceY + lookY, eyeSize * 0.5, 0, Math.PI * 2);
ctx.fill();
// Eyebrow Angling
if (this.anger > 0.1) {
ctx.strokeStyle = "#000000";
ctx.lineWidth = 3.5;
ctx.lineCap = "round";
let browOffset = 6 + (this.anger * 5);
ctx.beginPath();
ctx.moveTo(faceX - eyeSpacing - 12, faceY - browOffset + (this.anger * 6));
ctx.lineTo(faceX - eyeSpacing + 8, faceY - browOffset - (this.anger * 2));
ctx.moveTo(faceX + eyeSpacing + 12, faceY - browOffset + (this.anger * 6));
ctx.lineTo(faceX + eyeSpacing - 8, faceY - browOffset - (this.anger * 2));
ctx.stroke();
}
// Mouth Morph
ctx.beginPath();
if (this.anger < 0.4) {
ctx.arc(faceX, faceY + 8, 10, 0, Math.PI);
} else {
ctx.arc(faceX, faceY + 16, 8, Math.PI, 0);
}
ctx.strokeStyle = "#000000";
ctx.lineWidth = 3;
ctx.lineCap = "round";
ctx.stroke();
}
}
const blob = new Blob(window.innerWidth / 2, window.innerHeight / 2, 75, 18);
function getPos(e) {
let t = e.touches ? e.touches : e;
return { x: t.clientX, y: t.clientY };
}
function handleStart(e) {
mouse.down = true;
let pos = getPos(e);
mouse.x = pos.x;
mouse.y = pos.y;
let minDist = 9999;
let nodes = [...blob.points, blob.center];
nodes.forEach(p => {
let d = Math.hypot(p.x - mouse.x, p.y - mouse.y);
if (d < minDist) {
minDist = d;
mouse.draggedNode = p;
}
});
}
function handleMove(e) {
let pos = getPos(e);
mouse.x = pos.x;
mouse.y = pos.y;
}
function handleEnd() {
mouse.down = false;
mouse.draggedNode = null;
}
window.addEventListener('mousedown', handleStart);
window.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);
window.addEventListener('touchstart', handleStart, { passive: false });
window.addEventListener('touchmove', handleMove, { passive: false });
window.addEventListener('touchend', handleEnd);
function animate() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
blob.update();
blob.draw();
requestAnimationFrame(animate);
}
animate();
